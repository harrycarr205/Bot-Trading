[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tradingsystem"
version = "0.1.0"
description = "Autonomous paper-trading system: TradingAgents (Ollama) decisions, deterministic risk validation, Alpaca execution, Postgres/pgvector second brain."
requires-python = ">=3.11"
dependencies = [
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.1",
    "pgvector>=0.3",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "PyYAML>=6.0",
    "alpaca-py>=0.30",
    "httpx>=0.27",
    "apscheduler>=3.10",
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "jinja2>=3.1",
    "python-dotenv>=1.0",
    "psutil>=5.9",
    "tradingagents @ git+https://github.com/TauricResearch/TradingAgents.git@v0.3.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
